# Trimmed compute budget agreed during the original run: 1500 label / 400 tune /
# 700 eval queries per dataset.  Inherits every other setting from default.yaml.
#
#   python scripts/01_prepare_data.py --config configs/trimmed.yaml
#   python scripts/04_run_generation.py --config configs/trimmed.yaml
#   ... (pass the same --config to stages 05-09)
extends: default.yaml

sizes:
  label_pool: 1500
  dev_from_train: 400
  eval_dev: 700
